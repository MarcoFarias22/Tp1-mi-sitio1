<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Proyecto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mi Proyecto</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="index.html#sobre-mi">Acerca de</a> 
        <a href="contact.html">Contacto</a>
    </nav>

    <main>
        <section>
            <h2>Contacto</h2>
            <p>¿Tienes alguna pregunta? ¡Contáctanos!</p>
            
            <form action="#">
                <div>
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" minlength="3" placeholder="Tu nombre..." required>
                </div>

                <div>
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div>
                    <label for="message">Mensaje (mín. 10 caracteres):</label>
                    <textarea id="message" name="message" minlength="10" rows="4" placeholder="Escribe aquí tu consulta..." required></textarea>
                </div>

                <button type="submit">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Programador Junior</p>
    </footer>

</body>
</html>
