<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Farfan Arias Marco</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        
        <header>
            <div class="logo">
                <h1>Marco Farfan</h1>
            </div>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="index.html#sobre-mi">Acerca de</a> 
                <a href="contact.html">Contacto</a>
            </nav>
        </header>

        <aside class="sidebar">
            <h3>Contacto</h3>
            <p>Puedes encontrarme también en mis redes sociales o enviarme un correo directamente.</p>
        </aside>

        <main>
            <section id="contacto">
                <h2>¡Escríbeme!</h2>
                <p>Completa el formulario y me pondré en contacto contigo a la brevedad.</p>
                
                <form action="#">
                    <div>
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" name="name" minlength="3" placeholder="Tu nombre..." required>
                    </div>

                    <div>
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div>
                        <label for="phone">Teléfono (10 dígitos):</label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="Ej: 3871234567" required>
                    </div>

                    <div>
                        <label for="motivo">Motivo de contacto:</label>
                        <select id="motivo" name="motivo" required>
                            <option value="">Seleccione una opción</option>
                            <option value="consulta">Consulta general</option>
                            <option value="soporte">Soporte técnico</option>
                            <option value="presupuesto">Presupuesto</option>
                        </select>
                    </div>

                    <div>
                        <label for="message">Mensaje (mín. 10 caracteres):</label>
                        <textarea id="message" name="message" minlength="10" rows="4" placeholder="Escribe aquí tu consulta..." required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">Acepto los términos y condiciones</label>
                    </div>

                    <button type="submit">Enviar Mensaje</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 - Farfan Arias Marco | Salta, Argentina</p>
        </footer>
    </div>
</body>
</html>
