<form action="#">
    <div>
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" minlength="3" placeholder="Tu nombre..." required [cite: 10, 11]>
    </div>

    <div>
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required [cite: 10, 11]>
    </div>

    <div>
        <label for="phone">Teléfono:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10 dígitos" required [cite: 10, 11]>
    </div>

    <div>
        <label for="motivo">Motivo de contacto:</label>
        <select id="motivo" name="motivo" required [cite: 10, 11]>
            <option value="">Seleccione una opción</option>
            <option value="consulta">Consulta general</option>
            <option value="soporte">Soporte técnico</option>
            <option value="presupuesto">Presupuesto</option>
        </select>
    </div>

    <div>
        <label for="message">Mensaje (mín. 10 caracteres):</label>
        <textarea id="message" name="message" minlength="10" rows="4" placeholder="Escribe aquí tu consulta..." required [cite: 10, 11]></textarea>
    </div>

    <div>
        <input type="checkbox" id="terms" name="terms" required [cite: 10, 11]>
        <label for="terms">Acepto los términos y condiciones</label>
    </div>

    <button type="submit">Enviar Mensaje</button>
</form>
